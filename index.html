<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>William's Kart</title>
  <meta name="description" content="Comic-Rennspiel für Kinder – lenken durch Kippen von iPhone und iPad.">
  <meta name="theme-color" content="#6dc83e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="William Kart">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="stars" class="bubble"><span class="star">⭐</span><span id="starCount">0</span></div>
    <button id="gear" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </div>

  <div id="splash">
    <div class="bg"></div>
    <img src="images/splash.png" alt="William's Toys">
    <button id="start" class="btn">▶ Los geht's!</button>
  </div>

  <div id="settings" hidden>
    <div class="panel">
      <h2>Einstellungen</h2>
      <div class="choices">
        <button class="choice" data-mode="steady"><span class="ico">🐢</span><b>Gleich schnell</b></button>
        <button class="choice" data-mode="faster"><span class="ico">🚀</span><b>Immer schneller</b></button>
      </div>
      <div class="row">
        <button id="soundBtn" class="toggle">🔊 Ton an</button>
        <button id="invertBtn" class="toggle">↔️ Lenkung normal</button>
        <button id="obstBtn" class="toggle">🚧 Hindernisse an</button>
      </div>
      <div class="row">
        <button id="restartBtn" class="btn small">↺ Neu starten</button>
        <button id="quitBtn" class="btn small quit">⏏ Beenden</button>
        <button id="closeBtn" class="btn">Weiter ▶</button>
      </div>
      <p id="sizeInfo" class="size-info"></p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
